<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A link to the past</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      background-image: url('portada.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: contain;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    /* Botón personalizado: chico y en la parte inferior central */
    #btn-start {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background-color: #dc2626;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 6px;
      padding: 8px 18px;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.2;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }
    #btn-start:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <button id="btn-start" type="button">Start Game</button>

  <script>
    const btnStart = document.getElementById('btn-start');

    btnStart.addEventListener('click', () => {
      // Oculta tu botón inmediatamente al primer clic
      btnStart.style.display = 'none';

      // Configura EmulatorJS para arrancar directo sin mostrar su botón nativo
      window.EJS_player = '#game';
      window.EJS_core = 'snes';
      window.EJS_gameUrl = 'alttp.zip';
      window.EJS_backgroundImage = 'portada.jpg';
      window.EJS_backgroundBlur = false;
      window.EJS_color = '#dc2626';
      window.EJS_startOnLoaded = true;
      window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@4.2.3/data/';

      // Carga el emulador en ese mismo instante
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@4.2.3/data/loader.js';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
